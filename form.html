<!DOCTYPE html>
<html>


<head>


<title>
Form Alumni STP Isykariman
</title>


<link rel="stylesheet" href="form.css">


</head>



<body>



<div class="form-container">



<h1>
Form Alumni
<br>
STP Isykariman
</h1>



<p class="subtitle">

Lengkapi data alumni untuk mempererat silaturahmi

</p>





<form id="formAlumni">



<label>
Foto Profil
</label>


<input

type="file"

id="foto"

accept="image/*"

>





<label>
Nama Lengkap
</label>


<input

id="nama"

placeholder="Nama Lengkap"

required

>





<label>
Angkatan
</label>


<input

id="angkatan"

placeholder="Contoh: 2017"

required

>





<label>
Tahun Lulus
</label>


<input

id="tahun"

placeholder="Tahun Lulus"

>





<label>
Email
</label>


<input

id="email"

type="email"

placeholder="Email"

>





<label>
WhatsApp
</label>


<input

id="whatsapp"

placeholder="Nomor WhatsApp"

>





<label>
Asal Sekolah
</label>


<input

id="sekolah"

placeholder="Asal Sekolah"

>






<label>
Status Saat Ini
</label>


<select id="status">


<option>
Kuliah
</option>


<option>
Kerja
</option>


<option>
Usaha
</option>


</select>






<label>
Prestasi
</label>


<textarea

id="prestasi"

placeholder="Prestasi atau pengalaman"

></textarea>







<button type="submit">

Kirim Data Alumni

</button>





</form>



</div>







<script type="module" src="script.js"></script>


</body>


</html>
