<!DOCTYPE html>
<html>

<head>


<title>
Form Alumni STP Isykariman
</title>


<link rel="icon" href="logo.jpg">


<link rel="stylesheet" href="form.css">


</head>


<body>



<div class="header">


<img src="logo.jpg">


<h1>
Form Alumni
<br>
STP Isykariman
</h1>


<p>
Lengkapi data alumni untuk mempererat silaturahmi
</p>


</div>






<div class="form-box">



<form id="formAlumni">





<label>
Foto Profil
</label>


<input

type="file"

id="foto"

accept="image/*"

>







<label>
Nama Lengkap
</label>


<input

id="nama"

placeholder="Masukkan nama lengkap"

required

>







<label>
Angkatan
</label>


<input

id="angkatan"

placeholder="Contoh: 2017"

required

>







<label>
Tahun Lulus
</label>


<input

id="tahun"

placeholder="Contoh: 2022"

>







<label>
Email
</label>


<input

id="email"

type="email"

placeholder="Email aktif"

>







<label>
WhatsApp
</label>


<input

id="whatsapp"

placeholder="Nomor WhatsApp"

>







<label>
Asal Sekolah
</label>


<input

id="sekolah"

placeholder="Asal sekolah"

>







<label>
Status Saat Ini
</label>



<select id="status">


<option>
Kuliah
</option>


<option>
Kerja
</option>


<option>
Usaha
</option>


<option>
Lainnya
</option>


</select>







<label>
Prestasi / Pengalaman
</label>



<textarea

id="prestasi"

placeholder="Tuliskan prestasi atau pengalaman"

></textarea>








<button type="submit">

Kirim Data Alumni

</button>





</form>


</div>








<script type="module" src="script.js"></script>



</body>

</html>
